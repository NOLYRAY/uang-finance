<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Stylized Modern 'U' Logo in Emerald -->
  <path d="M168 140 V270 C168 325 205 372 256 372 C307 372 344 325 344 270 V140" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="44" 
        stroke-linecap="round"/>

  <!-- Inner Rupiah Sparkle / Dot Accent -->
  <circle cx="256" cy="270" r="28" fill="url(#accentGrad)"/>
</svg>
